<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة shamshr - إدارة عقود فريق شمس التطوعي</title>
    <style>
        :root {
            --primary: #0a192f;
            --accent: #f57c00;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a192f; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); margin-bottom: 20px; }
        h1, h2, h3 { text-align: center; color: var(--primary); margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .full-width { grid-column: span 2; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: var(--accent); color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #e65100; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-edit { background: #17a2b8; }
        .btn-edit:hover { background: #138496; }
        .hidden { display: none; }
        
        /* حاوية العقد المعتمدة على الصورة الأصلية */
        .contract-wrapper {
            position: relative;
            width: 800px;
            height: 1130px;
            margin: 0 auto;
            background: url('https://raw.githubusercontent.com/Riyad-R99/SHAMS.HR/main/WhatsApp%20Image%202026-09-04%20at%208.47.49%20PM.jpeg') no-repeat center center;
            background-size: 100% 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        /* الطبقات النصية المحددة بدقة فوق الصورة */
        .field {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            color: #000;
            white-space: nowrap;
        }

        /* تحديد أماكن إدراج النصوص على صورة العقد */
        #posAgreeDate { top: 145px; right: 540px; }
        #posName      { top: 203px; right: 620px; }
        #posId        { top: 228px; right: 590px; }
        #posPhone     { top: 252px; right: 590px; }
        #posDept      { top: 277px; right: 570px; }
        #posDuration  { top: 760px; right: 535px; }
        #posStart     { top: 785px; right: 510px; }
        #posEnd       { top: 785px; right: 685px; }

        /* جدول خزينة العقود */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--primary); color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .badge-active { background: #28a745; }
        .badge-warning { background: #ffc107; color: #333; }
        .badge-expired { background: #dc3545; }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .contract-wrapper { box-shadow: none; margin: 0; width: 100%; height: 100vh; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. تسجيل الدخول -->
    <div id="loginBox" class="card">
        <h2>تسجيل الدخول - منصة shamshr</h2>
        <div style="max-width: 400px; margin: 0 auto;">
            <input type="text" id="username" placeholder="اسم المستخدم" style="margin-bottom: 10px;">
            <input type="password" id="password" placeholder="كلمة المرور" style="margin-bottom: 10px;">
            <button onclick="login()">دخول</button>
            <p id="errorMsg" style="color:red; text-align:center;"></p>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" class="hidden">
        
        <div class="card no-print">
            <button onclick="showSection('create')" style="width: auto; margin-left: 10px;">+ إنشاء عقد جديد</button>
            <button onclick="showSection('vault')" class="btn-secondary" style="width: auto;">📁 خزينة العقود الموقعة</button>
        </div>

        <!-- 2. نموذج إدخال البيانات -->
        <div id="createSection" class="card no-print">
            <h3>إدخال بيانات عقد انضمام متطوع</h3>
            <div class="form-grid">
                <div><label>تاريخ الاتفاق:</label><input type="date" id="agreeDate"></div>
                <div><label>اسم المتطوع/ة:</label><input type="text" id="fullName" placeholder="الاسم الكامل"></div>
                <div><label>رقم الهوية:</label><input type="text" id="nationalId" placeholder="1XXXXXXXXX"></div>
                <div><label>رقم الجوال:</label><input type="text" id="phone" placeholder="05XXXXXXXX"></div>
                <div><label>القسم:</label><input type="text" id="department" placeholder="مثال: الإدارة والتنظيم"></div>
                <div><label>تاريخ بداية العقد:</label><input type="date" id="startDate"></div>
                <div class="full-width"><label>مدة العقد (بالأشهر):</label><input type="number" id="durationMonths" value="3"></div>
                <div class="full-width">
                    <button onclick="generateContract()">توليد العقد المطابق للصورة</button>
                </div>
            </div>
        </div>

        <!-- 3. عرض العقد فوق الصورة الأصلية -->
        <div id="contractPreviewSection" class="hidden">
            <div class="card no-print" style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="showSection('create')" class="btn-edit" style="width: auto;">✏️ تعديل البيانات (عودة)</button>
                <button onclick="window.print()" style="width: auto;">🖨️ طباعة العقد / حفظ كـ PDF</button>
                <button onclick="showSection('upload')" class="btn-secondary" style="width: auto;">📤 رفع العقد بعد التوقيع</button>
            </div>

            <!-- الورقة المطبوعة والمطابقة للصورة -->
            <div class="contract-wrapper" id="contractPaper">
                <div id="posAgreeDate" class="field"></div>
                <div id="posName" class="field"></div>
                <div id="posId" class="field"></div>
                <div id="posPhone" class="field"></div>
                <div id="posDept" class="field"></div>
                <div id="posDuration" class="field"></div>
                <div id="posStart" class="field"></div>
                <div id="posEnd" class="field"></div>
            </div>
        </div>

        <!-- 4. رفع العقد الموقّع -->
        <div id="uploadSection" class="card hidden no-print">
            <h3>رفع العقد الموقّع إلى الخزينة</h3>
            <div class="form-grid">
                <div><label>اسم المتطوع:</label><input type="text" id="upName"></div>
                <div><label>رقم الهوية:</label><input type="text" id="upId"></div>
                <div><label>تاريخ انتهاء العقد:</label><input type="date" id="upEndDate"></div>
                <div><label>إرفاق ملف/صورة العقد الموقّع:</label><input type="file" id="upFile" accept="image/*,.pdf"></div>
                <div class="full-width">
                    <button onclick="saveSignedContract()">حفظ العقد في خزينة العقود</button>
                </div>
            </div>
        </div>

        <!-- 5. خزينة العقود -->
        <div id="vaultSection" class="card hidden no-print">
            <h3>خزينة العقود الموقعة</h3>
            <table>
                <thead>
                    <tr>
                        <th>اسم المتطوع</th>
                        <th>رقم الهوية</th>
                        <th>تاريخ الانتهاء</th>
                        <th>حالة العقد (الإشعار)</th>
                        <th>الملف المرفق</th>
                    </tr>
                </thead>
                <tbody id="vaultTableBody">
                </tbody>
            </table>
        </div>

    </div>

</div>

<script>
    const users = {
        "Riyad": "5454645",
    };

    let contractsVault = [];

    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if(users[u] && users[u] === p) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        } else {
            document.getElementById('errorMsg').innerText = "بيانات الدخول غير صحيحة";
        }
    }

    function showSection(section) {
        document.getElementById('createSection').classList.add('hidden');
        document.getElementById('contractPreviewSection').classList.add('hidden');
        document.getElementById('uploadSection').classList.add('hidden');
        document.getElementById('vaultSection').classList.add('hidden');

        if(section === 'create') document.getElementById('createSection').classList.remove('hidden');
        if(section === 'upload') document.getElementById('uploadSection').classList.remove('hidden');
        if(section === 'vault') {
            document.getElementById('vaultSection').classList.remove('hidden');
            renderVault();
        }
    }

    function generateContract() {
        const agreeDate = document.getElementById('agreeDate').value;
        const name = document.getElementById('fullName').value;
        const id = document.getElementById('nationalId').value;
        const phone = document.getElementById('phone').value;
        const dept = document.getElementById('department').value;
        const start = document.getElementById('startDate').value;
        const duration = parseInt(document.getElementById('durationMonths').value);

        if(!name || !id || !start || !duration) {
            alert("يرجى تعبئة الحقول الأساسية (الاسم، الهوية، تاريخ البداية، مدة العقد)");
            return;
        }

        // حساب تاريخ الانتهاء
        let startDateObj = new Date(start);
        startDateObj.setMonth(startDateObj.getMonth() + duration);
        let endDateStr = startDateObj.toISOString().split('T')[0];

        function formatDate(dStr) {
            if(!dStr) return "";
            let parts = dStr.split('-');
            return `${parts[2]} / ${parts[1]} / ${parts[0]}`;
        }

        document.getElementById('posAgreeDate').innerText = formatDate(agreeDate || start);
        document.getElementById('posName').innerText = name;
        document.getElementById('posId').innerText = id;
        document.getElementById('posPhone').innerText = phone;
        document.getElementById('posDept').innerText = dept;
        document.getElementById('posDuration').innerText = duration;
        document.getElementById('posStart').innerText = formatDate(start);
        document.getElementById('posEnd').innerText = formatDate(endDateStr);

        // تجهيز بيانات شاشة الرفع
        document.getElementById('upName').value = name;
        document.getElementById('upId').value = id;
        document.getElementById('upEndDate').value = endDateStr;

        showSection('none');
        document.getElementById('contractPreviewSection').classList.remove('hidden');
    }

    function saveSignedContract() {
        const name = document.getElementById('upName').value;
        const id = document.getElementById('upId').value;
        const endDate = document.getElementById('upEndDate').value;
        const fileInput = document.getElementById('upFile');

        if(!name || !id || !endDate || fileInput.files.length === 0) {
            alert("يرجى تعبئة كافة البيانات وإرفاق ملف العقد");
            return;
        }

        contractsVault.push({
            name: name,
            id: id,
            endDate: endDate,
            file: fileInput.files[0].name
        });

        alert("تم حفظ العقد الموقّع بنجاح في خزينة العقود!");
        showSection('vault');
    }

    function renderVault() {
        const tbody = document.getElementById('vaultTableBody');
        tbody.innerHTML = '';
        const today = new Date();

        contractsVault.forEach(item => {
            const end = new Date(item.endDate);
            const diffDays = Math.ceil((end - today) / (1000 * 60 * 60 * 24));

            let statusBadge = '';
            if(diffDays < 0) {
                statusBadge = '<span class="status-badge badge-expired">منتهي</span>';
            } else if(diffDays <= 15) {
                statusBadge = '<span class="status-badge badge-warning">ينتهي قريباً (' + diffDays + ' يوم)</span>';
            } else {
                statusBadge = '<span class="status-badge badge-active">ساري (' + diffDays + ' يوم متبقي)</span>';
            }

            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.id}</td>
                    <td>${item.endDate}</td>
                    <td>${statusBadge}</td>
                    <td>📄 ${item.file}</td>
                </tr>
            `;
        });

        if(contractsVault.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">لا توجد عقود موقعة محفوظة في الخزينة حالياً</td></tr>';
        }
    }
</script>

</body>
</html>
