<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق شمس التطوعي - نظام إدارة وأرشيف العقود</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #f37021;
            --dark-navy: #000a30;
            --bg-body: #f4f6f9;
            --text-dark: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--dark-navy);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            color: var(--dark-navy);
        }

        .auth-card input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        .auth-card button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-orange);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="authSection" class="auth-overlay">
        <div class="auth-card">
            <h2>تسجيل الدخول</h2>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="login_user" placeholder="البريد الإلكتروني" required>
                <input type="password" id="login_pass" placeholder="كلمة المرور" required>
                <button type="submit">دخول</button>
            </form>
        </div>
    </div>

    <!-- محتوى التطبيق الأساسي (مخفي حتى يتم تسجيل الدخول) -->
    <div id="appContent" style="display: none; padding: 40px;">
        <h1>مرحباً بك في نظام إدارة العقود</h1>
        <p>تم تسجيل الدخول بنجاح عبر السحابة!</p>
        <button onclick="logoutSystem()" style="margin-top: 20px; padding: 10px 20px;">تسجيل الخروج</button>
    </div>

    <!-- مكتبات وإعدادات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5URBEngyoqj3NiuN_XZoY_GyXKu2t5Hs",
            authDomain: "shams-hr.firebaseapp.com",
            projectId: "shams-hr",
            storageBucket: "shams-hr.firebasestorage.app",
            messagingSenderId: "1048606917209",
            appId: "1:1048606917209:web:33f83ad2284adaeba8e748",
            measurementId: "G-VECB89CQ0K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // دالة تسجيل الدخول عبر السحابة
        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login_user').value.trim();
            const password = document.getElementById('login_pass').value.trim();

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appContent').style.display = 'block';
                    if (typeof renderUsers === 'function') renderUsers();
                    if (typeof renderArchive === 'function') renderArchive();
                })
                .catch((error) => {
                    alert('خطأ في البريد أو كلمة المرور: ' + error.message);
                });
        };

        // دالة تسجيل الخروج
        window.logoutSystem = function() {
            signOut(auth).then(() => {
                document.getElementById('login_user').value = '';
                document.getElementById('login_pass').value = '';
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
            });
        };
    </script>
</body>
</html>
