<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق شمس التطوعي - نظام إدارة وأرشيف العقود (متزامن)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #f37021;
            --dark-navy: #000a30;
            --bg-body: #f4f6f9;
            --text-dark: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
        }

        /* Strict Auth Lock Screen */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--dark-navy);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .auth-card h2 {
            color: var(--dark-navy);
            font-size: 22px;
            font-weight: 900;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .auth-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Nav Bar */
        .top-navbar {
            background: var(--dark-navy); color: white; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; z-index: 10;
        }
        .nav-links button {
            background: transparent; border: none; color: white; font-size: 14px; font-weight: 700;
            margin-left: 10px; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .nav-links button.active, .nav-links button:hover {
            background: var(--primary-orange);
        }

        /* Container & Cards Layout */
        .main-container { max-width: 950px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 5; }

        .card-box {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { text-align: right; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--dark-navy); }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .form-control:focus { border-color: var(--primary-orange); }

        /* Contract Paper Layout */
        .contract-paper {
            background: white; padding: 45px 50px; border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); position: relative; overflow: hidden;
        }
        .contract-title { text-align: center; font-size: 20px; font-weight: 900; color: #000; margin: 20px 0; }
        .contract-row { font-size: 15px; line-height: 2; font-weight: 600; color: #111; }
        .fill-val { border-bottom: 1px dashed #555; padding: 0 10px; font-weight: 800; color: #000; display: inline-block; }
        .section-h { font-size: 16px; font-weight: 900; color: #000; margin: 18px 0 6px 0; }
        .contract-ul { list-style: none; padding-right: 0; }
        .contract-ul li { font-size: 14px; line-height: 1.8; color: #222; font-weight: 500; }

        /* Signatures Layout */
        .sig-grid { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-top: 50px; 
            padding-top: 20px; 
            border-top: 1px solid #e2e8f0; 
        }
        .sig-box { text-align: center; flex: 1; padding: 0 10px; }
        .sig-box .title { 
            color: #000; 
            font-size: 13px; 
            font-weight: 800; 
            margin-bottom: 10px; 
        }
        .sig-line {
            border-bottom: 1px dashed #777;
            width: 80%;
            margin: 0 auto;
        }
        .sig-img {
            height: 55px;
            object-fit: contain;
            display: block;
            margin: 5px auto 0 auto;
        }

        /* Action Buttons */
        .btn-action { padding: 10px 18px; border-radius: 6px; font-weight: 800; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-orange { background: var(--primary-orange); color: white; }
        .btn-navy { background: var(--dark-navy); color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        /* Tables & Badges */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8fafc; color: var(--dark-navy); font-weight: 800; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block; }
        .badge-active { background: #dcfce7; color: #15803d; }
        .badge-warning { background: #fef9c3; color: #a16207; }
        .badge-expired { background: #fee2e2; color: #b91c1c; }

        @media print {
            .auth-overlay, .top-navbar, .card-box, .btn-action, .no-print { display: none !important; }
            .main-container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .contract-paper { box-shadow: none !important; padding: 20px !important; }
        }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authSection">
        <div class="auth-card">
            <img src="https://i.postimg.cc/MczxSRC6/a373f6e8-e93b-40df-a2b5-83c8caf5c7bb.png" alt="شعار فريق شمس" style="width: 100px; height: auto; max-height: 80px; object-fit: contain; margin-bottom: 10px;" onerror="this.style.display='none'">
            <h2>فريق شمس التطوعي</h2>
            <p>أدخل بيانات الحساب السحابي الموحد</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 12px;">
                    <input type="text" id="login_user" class="form-control" placeholder="اسم المستخدم" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="password" id="login_pass" class="form-control" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn-action btn-orange" style="width: 100%; justify-content: center; font-size: 15px; margin-bottom: 10px;"><i class="fas fa-lock-open"></i> تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <div id="appContent" style="display: none;">
        
        <div class="top-navbar">
            <div style="font-weight: 900; font-size: 18px;">فريق شمس التطوعي</div>
            <div class="nav-links">
                <button id="btn-create" class="active" onclick="switchTab('createTab')"><i class="fas fa-file-signature"></i> عقد جديد</button>
                <button id="btn-upload" onclick="switchTab('uploadTab')"><i class="fas fa-file-upload"></i> إرفاق عقد خارجي</button>
                <button id="btn-archive" onclick="switchTab('archiveTab')"><i class="fas fa-box-archive"></i> أرشيف العقود (<span id="contractCount">0</span>)</button>
                <button id="btn-users" onclick="switchTab('usersTab')" style="display: none;"><i class="fas fa-users-gear"></i> إدارة المستخدمين (<span id="usersCount">0</span>)</button>
            </div>
            <button onclick="logoutSystem();" class="btn-action" style="background: #475569; color: white;"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>

        <div class="main-container">
            
            <div id="createTab">
                <div class="card-box no-print">
                    <h3 style="margin-bottom: 20px; color: var(--dark-navy); border-bottom: 2px solid var(--primary-orange); padding-bottom: 8px;"><i class="fas fa-user-edit"></i> تعبئة بيانات المتطوع الجديد</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>الاسم الكامل</label>
                            <input type="text" id="in_name" class="form-control" placeholder="أدخل الاسم الكامل" oninput="updateContractPreview()">
                        </div>
                        <div class="form-group">
                            <label>رقم الهوية / الإقامة</label>
